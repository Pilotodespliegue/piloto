apiVersion: apps/v1
kind: Deployment
metadata:
  name: temperaturasapidotnet
  labels:
    app: temperaturasapidotnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temperaturasapidotnet
  template:
    metadata:
      labels:
        app: temperaturasapidotnet
    spec:
      containers:
        - name: temperaturasapidotnet
          image: middleware101bncrcontreg.azurecr.io/temperaturasapidotnet:__TAG__
          imagePullPolicy: Always
          ports:
            - containerPort: 5149
          resources:
            requests:
              memory: "100Mi"
              cpu: "10m"

---
apiVersion: v1
kind: Service
metadata:
  name: temperaturasapidotnetservice
  labels:
    app: temperaturasapidotnet
spec:
  type: ClusterIP
  selector:
    app: temperaturasapidotnet
  ports:
    - name: http
      port: 8080
      targetPort: 5149
      protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: temperaturasapidotnet
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
    appgw.ingress.kubernetes.io/use-private-ip: "true"
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
    appgw.ingress.kubernetes.io/appgw-ssl-certificate: "bnaksmiddleware"
spec:
  rules:
    - http:
        paths:
          - path: /weatherforecast/
            pathType: Prefix
            backend:
              service:
                name: temperaturasapidotnetservice
                port:
                  number: 8080
