name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      target-environment:
        description: "Ambiente destino"
        required: true
        type: choice
        options:
          - DEV
          - QA
          - PROD
        default: DEV
      image-tag:
        description: "Etiqueta de imagen existente (obligatoria para QA/PROD)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  cicd:
    name: CI/CD Pipeline
    uses: Pilotodespliegue/automation/.github/workflows/aks.cicd.yml@main
    with:
      branch-name: ${{ github.head_ref || github.ref_name }}
      image-name: TemperaturasApi
      dockerfile-path: ./TemperaturasApi
      deployment-file: ./TemperaturasApi/deployment.yaml
      deployment-name: temperaturas-api
      container-name: temperaturas-api
      target-environment: ${{ inputs.target-environment || 'DEV' }}
      image-tag: ${{ inputs.image-tag || '' }}
