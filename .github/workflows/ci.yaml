name: CI/CD Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  cicd:
    name: CI/CD Pipeline
    uses: Pilotodespliegue/automation/.github/workflows/aks.cicd.yml@main
    with:
      branch-name: ${{ github.ref_name }}
      image-name: TemperaturasApi
      dockerfile-path: ./TemperaturasApi
      deployment-file: ./TemperaturasApi/deployment.yaml
